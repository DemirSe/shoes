name: Offline binaries
on:
  workflow_dispatch:
permissions: {}
env:
  CARGO_NET_OFFLINE: 'true'
  RUSTUP_AUTO_INSTALL: '0'
  CROSS_CONTAINER_OPTS: '--network=none'
jobs:
  build:
    runs-on: [self-hosted, '${{ matrix.runner }}']
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: shoes-offline-linux
            builder: cargo
          - target: x86_64-unknown-linux-musl
            runner: shoes-offline-linux
            builder: cross
          - target: aarch64-unknown-linux-gnu
            runner: shoes-offline-linux
            builder: cross
          - target: aarch64-unknown-linux-musl
            runner: shoes-offline-linux
            builder: cross
          - target: x86_64-apple-darwin
            runner: shoes-offline-macos
            builder: cargo
          - target: aarch64-apple-darwin
            runner: shoes-offline-macos
            builder: cargo
    steps:
      - name: Verify pre-provisioned source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Build with preinstalled toolchain and container images
        run: ${{ matrix.builder }} build --release --locked --offline --target ${{ matrix.target }}
      - name: Verify binary
        run: test -x target/${{ matrix.target }}/release/shoes
