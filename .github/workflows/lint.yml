name: Offline lint
on:
  workflow_dispatch:
permissions: {}
env:
  CARGO_NET_OFFLINE: 'true'
  RUSTUP_AUTO_INSTALL: '0'
jobs:
  lint:
    runs-on: [self-hosted, shoes-offline-linux]
    steps:
      - name: Verify pre-provisioned source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --locked --offline --all-targets --all-features -- -D warnings
