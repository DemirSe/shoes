name: Offline mobile libraries
on:
  workflow_dispatch:
permissions: {}
env:
  CARGO_NET_OFFLINE: 'true'
  RUSTUP_AUTO_INSTALL: '0'
jobs:
  ios:
    runs-on: [self-hosted, shoes-offline-macos]
    steps:
      - name: Verify pre-provisioned source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Require preinstalled tools
        run: command -v cbindgen && command -v xcodebuild
      - name: Build XCFramework
        run: bash scripts/build-ios.sh
  android:
    runs-on: [self-hosted, shoes-offline-linux]
    steps:
      - name: Verify pre-provisioned source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Require preinstalled tools
        run: cargo ndk --version && command -v gradle && java -version
      - name: Build AAR
        run: bash scripts/build-android.sh
