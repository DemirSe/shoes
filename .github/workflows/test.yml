name: Offline tests
on:
  workflow_dispatch:
permissions: {}
env:
  CARGO_NET_OFFLINE: 'true'
  RUSTUP_AUTO_INSTALL: '0'
  RUST_BACKTRACE: '0'
jobs:
  local-tests:
    runs-on: [self-hosted, shoes-offline-linux]
    timeout-minutes: 30
    steps:
      - name: Verify pre-provisioned source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Unit tests
        run: cargo test --workspace --locked --offline --lib --bins
      - name: Host FFI tests
        run: cargo test -p shoes --locked --offline --lib --features ffi -- --test-threads=1
      - name: Require preinstalled test peer
        run: test -n "$SHOES_TEST_SING_BOX_BIN" && test -x "$SHOES_TEST_SING_BOX_BIN"
      - name: Local integration tests
        run: cargo test -p shoes --locked --offline --features integration-tests --test integration -- --test-threads=1
  rootless-macos:
    runs-on: [self-hosted, shoes-offline-macos]
    timeout-minutes: 30
    steps:
      - name: Verify pre-provisioned source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Rootless TUN tests
        run: >-
          cargo test -p shoes --locked --offline --lib --features ffi tun:: -- --test-threads=1
