[package]
name = "shoes"
version = "0.3.2"
edition = "2024"
autotests = false
license = "MIT"
description = "A multi-protocol proxy server."
homepage = "https://github.com/cfal/shoes/"
repository = "https://github.com/cfal/shoes/"
readme = "README.md"
keywords = ["proxy", "vless", "reality", "vision", "xudp"]
categories = ["command-line-utilities", "network-programming"]

[workspace]
members = ["tests/support"]
resolver = "3"

[lib]
name = "shoes"
# rlib = Rust library (for Rust dependencies)
# cdylib = C dynamic library (.so on Linux/Android, .dylib on macOS)
# staticlib = C static library (.a) - required for iOS
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "shoes"
path = "src/main.rs"

[features]
default = []
ffi = []  # Enable FFI module for non-Android builds
integration-tests = []
external-network-tests = ["integration-tests"]
privileged-tests = ["integration-tests"]
stress-tests = ["integration-tests"]

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration-tests"]

[[test]]
name = "external_network"
path = "tests/external_network.rs"
required-features = ["external-network-tests"]

[[test]]
name = "privileged"
path = "tests/privileged.rs"
required-features = ["privileged-tests"]

[[test]]
name = "stress"
path = "tests/stress.rs"
required-features = ["stress-tests"]

[dependencies]
async-trait = "=0.1.92"
aws-lc-rs = { version = "=1.18.1", default-features = false }
base64 = "=0.23.1"
bytes = "=1.12.1"
chrono = "=0.4.45"
digest = "=0.11.3"
etherparse = "=0.21.0"
futures = "=0.3.34"
h2 = "=0.4.19"
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["tokio", "tls-aws-lc-rs", "https-aws-lc-rs", "h3-aws-lc-rs"] }
http = "=1.5.0"
indexmap = "=2.14.2"
libc = "=0.2.190"
log = { version = "=0.4.34", features = ["std", "release_max_level_info"] }
lru = "=0.18.5"
memchr = "=2.8.3"
notify = "=8.2.0"
parking_lot = "=0.12.5"
quinn = { version = "=0.11.12", default-features = false, features = ["log", "platform-verifier", "runtime-tokio", "rustls-aws-lc-rs"] }
rand = "=0.10.3"
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rustc-hash = "=2.1.3"
rustls = "=0.23.45"
serde = { version = "=1.0.229", features = ["derive", "std"] }
serde_yaml = "=0.9.34"
smoltcp = { version = "=0.14.0", default-features = false, features = ["std", "log", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-icmp", "auto-icmp-echo-reply", "socket-udp", "socket-tcp", "socket-tcp-cubic", "phy-tuntap_interface", "assembler-max-segment-count-32"] }
socket2 = "=0.6.5"
subtle = "=2.6.1"
tokio = { version = "=1.53.2", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { version = "=0.7.19", features = ["time", "io"] }
tun = { version = "=0.8.14", features = ["async"] }
url = "=2.5.8"
webpki-roots = { version = "=1.0.9" }
x509-parser = { version = "=0.18.1", default-features = false, features = ["verify-aws"] }

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["test-util"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls-pemfile = "=2.2.0"
serde_json = "=1.0.151"
shoes-test-support = { path = "tests/support" }
tempfile = "=3.27.0"
tokio-rustls = "=0.26.6"

# jemalloc for better memory performance (not supported on Windows MSVC, iOS, or Android)
[target.'cfg(not(any(target_env = "msvc", target_os = "ios", target_os = "android")))'.dependencies]
tikv-jemallocator = "=0.7.0"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "=0.15.1"
jni = "=0.22.4"
ndk-sys = "=0.6.0"

[profile.release]
opt-level = 3
lto = "fat"
strip = true
