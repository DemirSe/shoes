# =============================================================================
# Usage Notes (local test only)
# =============================================================================
#
# 1. After starting the TUN server, add a route for the test destination:
#    sudo ip route add <destination>/32 dev tun0
#
# 2. For Android/iOS, the device_fd is provided by the OS VPN service:
#    - device_fd: 123  # FD from VpnService/NEPacketTunnelProvider
