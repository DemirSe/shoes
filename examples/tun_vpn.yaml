# TUN VPN Test Example (Linux)
#
# TUN (network TUNnel) devices operate at the IP layer (Layer 3), allowing
# shoes to act as a transparent VPN that captures all IP traffic.
#
# This file is a local connectivity test only. It is not a production config
# and not a full-tunnel deployment recipe.
#
# IMPORTANT: TUN servers require root privileges on Linux.
# Run with: sudo shoes examples/tun_vpn.yaml
#
# Linux-first; TUN/FFI code is retained for unix targets including Android
# (device_fd from VpnService.Builder.establish()) and iOS
# (device_fd from NEPacketTunnelProvider.packetFlow).

# =============================================================================
# Example 1: Basic TUN VPN (Direct Connection)
# =============================================================================
# Routes all traffic directly to the destination.
# Local connectivity test and base configuration only.

- device_name: "tun0"
  address: "10.0.0.1"
  netmask: "255.255.255.0"
  mtu: 1500
  tcp_enabled: true
  udp_enabled: true
  icmp_enabled: true
  rules:
    - masks: "0.0.0.0/0"
      action: allow
      client_chain:
        - protocol:
            type: direct

