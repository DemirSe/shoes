# Basic Reality server with VLESS
# General configuration example, not the production profile.
# Production also requires an explicit public IPv4 listener and Vision.
#
# Reality uses X25519 key exchange and HMAC-signed certificates to provide
# enhanced privacy. Unauthenticated traffic may be forwarded to the same cover.
# This is not a guarantee that proxy traffic is indistinguishable from that site.
#
# Generate a Reality keypair with: shoes generate-reality-keypair

- address: "0.0.0.0:443"
  protocol:
    type: tls
    reality_targets:
      "whatsapp.net":
        # X25519 private key (32 bytes, base64url encoded)
        # Keep this secret! Clients need the corresponding public key.
        private_key: "YOUR_PRIVATE_KEY_HERE"

        # List of valid short IDs (hex strings, 0-16 chars)
        # Clients must use one of these IDs to connect
        # The VLESS UUID is still required for authenticated proxy traffic.
        short_ids:
          - "0123456789abcdef"  # Specific client ID

        # Fixed cover for unauthenticated traffic; not the optional VLESS fallback.
        # If the cover fails, the connection stops.
        dest: "whatsapp.net:443"

        # Optional: Maximum timestamp difference in milliseconds (default: 60000)
        # Rejects stale timestamps; this is not a replay cache.
        max_time_diff: 60000  # 1 minute

        # Optional: Client version restrictions [major, minor, patch]
        # min_client_version: [1, 8, 0]
        # max_client_version: [2, 0, 0]

        # Optional: TLS 1.3 cipher suites to support
        # Valid: TLS_AES_128_GCM_SHA256, TLS_AES_256_GCM_SHA384, TLS_CHACHA20_POLY1305_SHA256
        # cipher_suites: ["TLS_AES_256_GCM_SHA384", "TLS_CHACHA20_POLY1305_SHA256"]

        # Inner protocol - the actual proxy protocol used after Reality handshake
        protocol:
          type: vless
          user_id: "b85798ef-e9dc-46a4-9a87-8da4499d36d0"
          udp_enabled: true  # Enable XUDP for UDP multiplexing
