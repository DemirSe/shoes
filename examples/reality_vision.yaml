# Reality + Vision server
# General configuration example; production requires an explicit public IPv4.
#
# Reality provides censorship resistance through TLS 1.3 mimicry
# Vision can enter a direct transfer mode for eligible TLS-in-TLS traffic.
# Splice and performance depend on stream state, platform and workload.
# Neither traffic indistinguishability nor a speed gain is guaranteed.

- address: "0.0.0.0:443"
  protocol:
    type: tls
    reality_targets:
      "whatsapp.net":
        private_key: "YOUR_PRIVATE_KEY_HERE"
        short_ids: ["0123456789abcdef"]
        dest: "whatsapp.net:443"

        # Enable XTLS-Vision for TLS-in-TLS optimization
        # When enabled, Vision detects TLS-in-TLS scenarios and switches
        # to Direct mode when eligible; other traffic retains buffered copying
        # IMPORTANT: Vision requires VLESS as the inner protocol
        vision: true

        protocol:
          type: vless  # Vision REQUIRES VLESS
          user_id: "b85798ef-e9dc-46a4-9a87-8da4499d36d0"
          udp_enabled: true

# A failed cover connection stops the connection; no alternate cover is used.
